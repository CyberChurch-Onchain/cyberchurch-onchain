steps:
  # Deploy existing image to Cloud Run (no new build)
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'staging-api'
      - '--image'
      - 'gcr.io/bold-ally-485107-b8/staging-api:staging-api-00025-5xw'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'bold-ally-485107-b8'
      - '--allow-unauthenticated'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY
