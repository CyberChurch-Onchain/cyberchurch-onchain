steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/bold-ally-485107-b8/staging-api:$SHORT_SHA'
      - '-t'
      - 'gcr.io/bold-ally-485107-b8/staging-api:latest'
      - '.'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'staging-api'
      - '--image'
      - 'gcr.io/bold-ally-485107-b8/staging-api:$SHORT_SHA'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'bold-ally-485107-b8'
      - '--allow-unauthenticated'
      - '--quiet'

options:
  logging: CLOUD_LOGGING_ONLY
